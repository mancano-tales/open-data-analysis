project:
  type: website
  output-dir: docs

# Perfil padrao: `quarto render` puro produz a versao em INGLES (raiz de docs/).
# Mesmo padrao usado no repositorio da dissertacao (ver
# 9-vers/plan/2026-08-23_Plano_Dissertacao_Bilingue.md la): listas de
# conteudo (aqui, `listing: contents:` e a pagina index) NAO ficam neste
# arquivo base porque perfis do Quarto fundem alguns valores por chave —
# manter tudo especifico de idioma em _quarto-en.yml/_quarto-pt.yml evita
# qualquer risco de mistura entre os dois idiomas.
profile:
  default: en

website:
  # Posts com `draft: true` (descontinuados) continuam sendo renderizados, para
  # que links antigos nao quebrem, mas ficam fora da listagem, da busca e do
  # sitemap. Cada um traz um aviso no topo apontando a analise que o substitui.
  draft-mode: unlinked

format:
  html:
    theme: cosmo
    css: styles.css
